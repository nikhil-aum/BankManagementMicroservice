spring.application.name=account-service

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/bankManagement_account_db?createDatabaseIfNotExist=true

spring.config.import=optional:configserver:http://localhost:8084
# Springdoc / Swagger OpenAPI Properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.servers[0].url=http://localhost:8080
springdoc.servers[0].description=API Gateway Server
spring.jpa.hibernate.ddl-auto=update


# OpenFeign Circuit Breaker enable
spring.cloud.openfeign.circuitbreaker.enabled=true

# Actuator Health
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Resilience4j Config for customer-service
resilience4j.circuitbreaker.instances.customer-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.customer-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.customer-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.customer-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customer-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.customer-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.customer-service.automaticTransitionFromOpenToHalfOpenEnabled=true

#Define these exceptions to be counted as failures.
resilience4j.circuitbreaker.instances.customer-service.recordExceptions=java.lang.Exception,java.lang.RuntimeException,feign.FeignException