spring.application.name=api-gateway



# Eureka client config
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email
  # Google OAuth2 Resource Server Configuration (JWT Validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# Enable Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# Customer Service Config for Dropdown
springdoc.swagger-ui.urls[0].name=Customer Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/customer-service

# Account Service Config for Dropdown
springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/account-service