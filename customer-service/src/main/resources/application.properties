spring.application.name=customer-service
spring.profiles.active=default
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/bankManagement_customer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.config.import=optional:configserver:http://localhost:8084


spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update